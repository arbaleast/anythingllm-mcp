[project]
name = "anythingllm-mcp"
version = "1.0.0"
description = "MCP Server for AnythingLLM - Workspace, Chat, Document, and System management"
requires-python = ">=3.10"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "andre" }
]
keywords = ["mcp", "anythingllm", "llm", "agent", "server"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp[cli]>=1.27.0",
    "httpx>=0.27.0",
    "pydantic>=2.13.1",
    "fastapi>=0.136.1",
    "uvicorn>=0.48.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "respx>=0.23.1",
]
image = [
    "pillow>=10.0.0",
]

[project.urls]
Homepage = "https://github.com/andreperez/anythingllm-mcp"
Repository = "https://github.com/andreperez/anythingllm-mcp"
Issues = "https://github.com/andreperez/anythingllm-mcp/issues"

# NOTE: The canonical AnythingLLM API usage is in anythingllm_mcp.py (/api/v1, Bearer).
# HTTP servers (SSE, Streamable HTTP, REST gateway) are started directly:
#   python server_sse.py        # SSE transport on port 8766
#   python server_streamable.py # Streamable HTTP on port 8766
#   python server_http.py       # REST gateway → AnythingLLM (set HTTP_API_KEY + ANYTHINGLLM_API_KEY)
# Image asset: uv sync --extra image && python generate_mcp_bridge_image.py

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/anythingllm_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
